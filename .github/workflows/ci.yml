# Added per docs/design/05-prd.md §9 "Cross-cutting" ahead of any GitHub remote — the repo
# currently lives on origin.cursor.com, so this workflow will not run until the repo (or a
# mirror of it) is hosted on GitHub.
#
# `fmt`, `clippy`, and `deny` run once on Linux since their result does not depend on OS;
# `test` and `msrv` run on both macOS and Linux because `/bin/sh` differs there (dash vs.
# bash-in-POSIX-mode) and kadou-exec shells out to it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Includes the tools/list byte-snapshot against docs/design/tools-list.json (§1.3,
      # §9 slice 5) once that insta test lands — it is a normal `cargo test`, not a
      # separate CI step.
      - run: cargo test --workspace

  msrv:
    name: msrv 1.88 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Mutation testing ratchet (docs/design/10-mutation-baseline.md has the measured baseline
  # and the exact commands). macOS only, like `test`/`msrv` above, since kadou-exec's process
  # tests are platform-sensitive and this exercises the same binaries. `.cargo/mutants.toml`
  # excludes only the empty `kadou-mine` stub and `kadou`'s own `fn main` (never exercised by
  # `cargo test`, only by the built binary `tests/cli.rs` drives) — every other function in
  # every crate, `kadou` included, is covered now that R15 moved the CLI's subprocess tests
  # into a real integration test target.
  #
  # This job has never actually run under Actions — the repo isn't hosted on GitHub yet (see
  # the note at the top of this file) — so its real CI wall-clock time is unverified. The
  # local 2026-09-12 re-measurement took ~18 minutes at `-j 4` for 925 mutants; if the first
  # real run on a GitHub-hosted macOS runner blows past ~40 minutes, shard with `cargo mutants
  # --shard i/N` across a matrix rather than raising this timeout.
  mutants:
    name: mutants
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace -j 3
      - name: Enforce the per-crate caught-ratio floor
        run: |
          set -euo pipefail
          check() {
            crate="$1"; min="$2"
            caught=$(grep -c "crates/$crate/" mutants.out/caught.txt || true)
            missed=$(grep -c "crates/$crate/" mutants.out/missed.txt || true)
            timedout=$(grep -c "crates/$crate/" mutants.out/timeout.txt || true)
            viable=$((caught + missed + timedout))
            if [ "$viable" -eq 0 ]; then
              echo "::error::no viable $crate mutants were generated; check .cargo/mutants.toml"
              exit 1
            fi
            pct=$(awk -v c="$caught" -v v="$viable" 'BEGIN { printf "%.1f", (c / v) * 100 }')
            echo "$crate: $caught/$viable viable mutants caught (${pct}%), floor ${min}%"
            awk -v pct="$pct" -v min="$min" 'BEGIN { exit !(pct + 0 >= min) }' ||
              { echo "::error::$crate caught ratio ${pct}% is below the ${min}% floor"; exit 1; }
          }
          # Floors are the 2026-09-12 re-measurement (docs/design/10-mutation-baseline.md's
          # dated second section), rounded down to the nearest 5%. Raise a floor only after
          # re-measuring a real improvement; never lower one just to make a red build pass.
          # `kadou` is measured for the first time here -- `.cargo/mutants.toml` used to
          # exclude the whole crate (its CLI subprocess tests couldn't run at all, see the
          # doc's "Known blocker"); R15 moved them to a real integration test target, so the
          # bin crate is now mutation-tested like everything else.
          check kadou-core 85
          check kadou-exec 80
          check kadou-mcp 80
          check kadou 80
