# Added per docs/design/05-prd.md §9 "Cross-cutting" ahead of any GitHub remote — the repo
# currently lives on origin.cursor.com, so this workflow will not run until the repo (or a
# mirror of it) is hosted on GitHub.
#
# `fmt`, `clippy`, and `deny` run once on Linux since their result does not depend on OS;
# `test` and `msrv` run on both macOS and Linux because `/bin/sh` differs there (dash vs.
# bash-in-POSIX-mode) and kadou-exec shells out to it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Includes the tools/list byte-snapshot against docs/design/tools-list.json (§1.3,
      # §9 slice 5) once that insta test lands — it is a normal `cargo test`, not a
      # separate CI step.
      - run: cargo test --workspace

  msrv:
    name: msrv 1.88 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Mutation testing ratchet (docs/design/10-mutation-baseline.md has the measured baseline
  # and the exact commands). macOS only, like `test`/`msrv` above, since kadou-exec's process
  # tests are platform-sensitive and this exercises the same binaries. `.cargo/mutants.toml`
  # excludes only `kadou`'s own `fn main` (never exercised by `cargo test`, only by the built
  # binary `tests/cli.rs` drives) — every other function in every crate, `kadou` and
  # `kadou-mine` included, is covered.
  #
  # Sharded 4 ways (Later-4, `docs/design/12-mvp-review.md` §5/§6): a full `--workspace` run
  # measured 1592 mutants in 56 minutes at `-j 4` on an 18-core Mac, against a 60-minute wall
  # at `-j 3` on a shared GitHub runner — not headroom, a coin flip. Each shard runs a quarter
  # of the mutant list (`--shard i/4`, cargo-mutants' own partitioning, not a hand-rolled
  # split) and uploads its own `mutants.out`; `mutants-floor` downloads all four and checks
  # each crate's floor against the union — the same floors a single unsharded run would check,
  # just computed from four smaller `caught.txt`/`missed.txt`/`timeout.txt` sets instead of one.
  mutants:
    name: mutants (shard ${{ matrix.shard }}/4)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 0-indexed: cargo-mutants requires shard k < n (`--shard 4/4` is a hard error).
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace -j 3 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: error

  mutants-floor:
    name: mutants floor (merged)
    needs: mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: mutants-shards
      - name: Enforce the per-crate caught-ratio floor across all four shards
        run: |
          set -euo pipefail
          check() {
            crate="$1"; min="$2"
            caught=$(cat mutants-shards/*/caught.txt 2>/dev/null | grep -c "crates/$crate/" || true)
            missed=$(cat mutants-shards/*/missed.txt 2>/dev/null | grep -c "crates/$crate/" || true)
            timedout=$(cat mutants-shards/*/timeout.txt 2>/dev/null | grep -c "crates/$crate/" || true)
            viable=$((caught + missed + timedout))
            if [ "$viable" -eq 0 ]; then
              echo "::error::no viable $crate mutants were generated; check .cargo/mutants.toml"
              exit 1
            fi
            pct=$(awk -v c="$caught" -v v="$viable" 'BEGIN { printf "%.1f", (c / v) * 100 }')
            echo "$crate: $caught/$viable viable mutants caught (${pct}%), floor ${min}%"
            awk -v pct="$pct" -v min="$min" 'BEGIN { exit !(pct + 0 >= min) }' ||
              { echo "::error::$crate caught ratio ${pct}% is below the ${min}% floor"; exit 1; }
          }
          # Floors are each crate's own latest dated measurement in
          # docs/design/10-mutation-baseline.md, rounded down to the nearest 5%. Raise a floor
          # only after re-measuring a real improvement; never lower one just to make a red
          # build pass.
          check kadou-core 85
          check kadou-exec 80
          check kadou-mcp 80
          check kadou 90
          check kadou-mine 75
