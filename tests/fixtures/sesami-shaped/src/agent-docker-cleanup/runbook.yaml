name: agent-docker-cleanup
version: 1.0.0
description: Trigger the Infra agent-docker-cleanup pipeline — prunes Docker images and containers on Jenkins agents
risk_level: medium
script: script.sh
parameters:
  - name: jenkins_url
    type: string
    required: true
    description: Jenkins server URL
    scope: global
    default: "https://ci.example.com"
    secret: false
  - name: jenkins_user
    type: string
    required: true
    description: Jenkins username or service account ID
    scope: global
    secret: false
  - name: jenkins_token
    type: string
    required: true
    description: Jenkins API token
    scope: global
    secret: true
