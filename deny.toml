# cargo-deny configuration (docs/design/05-prd.md §3.3). Run with `cargo deny check`.
# Requires cargo-deny 0.20.2+ (rust-version 1.88, per §3.1 dev/test row).

[graph]
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Every dependency in this workspace offers a permissive option: MIT / Apache-2.0 /
# MPL-2.0 / BSD-family / Unicode (§3.3). nucleo-matcher's MPL-2.0 is file-level copyleft
# and is explicitly allowed. rmcp is Apache-2.0-only, which needs NOTICE handling in
# release archives (gated on Mason, §7.4) but is not itself a deny.toml concern.
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
